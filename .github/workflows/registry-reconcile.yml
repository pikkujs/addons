name: Reconcile Registry

# Keeps the pikkufabric catalogues (staging AND production — see
# scripts/registry-targets.sh) in step with what is actually published to npm.
# The release workflow notifies the registries per-publish, but that can miss
# packages (npm's read path lags right after a publish, and packages published
# before the notify step existed were never ingested at all). This diffs each
# catalogue against the checkout and ingests only that environment's difference,
# so an environment reset back to empty is repopulated in full.
#
# Runs on demand, and daily so drift is repaired without anyone noticing it.

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Space-separated pkg[@version] list. Empty = reconcile everything.'
        required: false
        default: ''
      all:
        description: 'Re-ingest EVERY package, rebuilding stored metadata (overrides the list above).'
        type: boolean
        required: false
        default: false
  schedule:
    # 04:00 UTC daily — well clear of release traffic.
    - cron: '0 4 * * *'

concurrency: ${{ github.workflow }}

env:
  YARN_ENABLE_IMMUTABLE_INSTALLS: false

jobs:
  reconcile:
    name: Reconcile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
        shell: bash
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No `yarn install` needed: the reconcile path only reads package.json
      # versions and calls the registry over HTTP.
      # `--reconcile` only ingests versions the catalogue is MISSING, so it cannot
      # repair an entry stored at the right version with the wrong contents — a
      # broken extractor leaves exactly that, and every nightly run then correctly
      # reports "Missing: 0, stale: 0" and does nothing (2026-08-14 to 2026-08-22,
      # 217 rows with an empty displayName). `--all` is the repair path for that.
      - name: Reconcile
        run: |
          if [ "${{ inputs.all }}" = "true" ]; then
            bash scripts/backfill-registry.sh --all
          elif [ -n "${{ inputs.packages }}" ]; then
            bash scripts/backfill-registry.sh ${{ inputs.packages }}
          else
            bash scripts/backfill-registry.sh --reconcile
          fi
        env:
          REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}
