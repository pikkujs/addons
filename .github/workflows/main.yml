  # One job for every changed addon: installing once and building in parallel
  # across the runner's cores beats a matrix job per addon, which spent most of
  # its time on its own `bun install`.
  build:
    name: Build changed addons
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install
      - run: scripts/build-addons.sh --changed

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install
      - run: bun run pikku

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v2
        with:
          version-script: node .github/changeset-version.cjs
          publish-script: bun run release
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          YARN_NPM_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          HUSKY: '0'

      # notify-registry.sh ingests into every environment listed in
      # scripts/registry-targets.sh (staging and production), so a released
      # addon is installable in both as soon as it lands on npm.
      - name: Notify registry of published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Each package is notified independently: a single failure must not
          # abort the loop (the step's shell runs with -e), or every package
          # after it silently never gets ingested despite being live on npm.
          # Failures are collected and reported once, at the end.
          failed=()
          while IFS=$'\t' read -r name version; do
            if ! bash scripts/notify-registry.sh "$name" "$version"; then
              echo "::warning::Registry ingest failed for $name@$version — re-run with scripts/backfill-registry.sh"
              failed+=("$name@$version")
            fi
          done < <(echo '${{ steps.changesets.outputs.published-packages }}' | \
            node -e "
              const pkgs = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
              for (const pkg of pkgs) {
                console.log(pkg.name + '\t' + pkg.version);
              }
            ")

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::${#failed[@]} package(s) published to npm but not ingested into the registry:"
            printf '  - %s\n' "${failed[@]}"
            echo "Backfill them with: REGISTRY_API_KEY=… bash scripts/backfill-registry.sh ${failed[*]}"
            exit 1
          fi

          echo "All published packages ingested into the registry ✓"
        env:
          REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}

      # backfill-registry.sh reads versions from the checkout, and the step above
      # leaves that checkout rewritten to the NEXT versions: on a run that creates
      # a Version Packages PR, changeset-version.cjs bumps every package.json in
      # place and those bumps are pushed to changeset-release/main, not consumed
      # here. Reconciling against that tree asks npm for versions that do not
      # exist yet — 404 on every package, six retries each, ~28 hours of a job
      # that looks busy and achieves nothing (2026-08-21).
      #
      # Restore to github.sha, NOT `git checkout -- .`: changesets/action does not
      # leave the bumps as working-tree dirt, it COMMITS them onto a local
      # changeset-release/main before pushing. A plain restore then has nothing to
      # revert — the tree is clean, the bumps are in HEAD — and the reconcile 404s
      # exactly as before (run 32589916006, asking for aws-transcribe@0.0.7 while
      # npm had 0.0.6). Naming the triggering commit is indifferent to which branch
      # the action left us on and to whether it committed at all.
      - name: Restore checkout versions
        if: always() && !cancelled()
        run: git checkout ${{ github.sha }} -- .

      # Safety net for anything the per-release notify above never covered:
      # packages published before the notify step existed, or stranded when an
      # earlier run failed mid-loop. Diffs the catalogue against the checkout and
      # ingests only the difference, so it is a no-op once the two agree.
      - name: Reconcile registry with npm
        if: always() && !cancelled()
        run: bash scripts/backfill-registry.sh --reconcile
        env:
          REGISTRY_API_KEY: ${{ secrets.REGISTRY_API_KEY }}
